<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone風ホーム画面</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at 20% 20%, #ff8fa3, #ff6f91, #ff9671, #ffc75f, #f9f871);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 40px 20px 80px;
    color: #000;
    transition: background 0.6s ease, filter 0.3s ease;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }

  .icon {
    text-align: center;
  }

  .icon img {
    width: 72px;
    height: 72px;
    object-fit: cover;
    background: #ffffff;
    border-radius: 22px;
    padding: 0;
    box-sizing: border-box;
    transition: transform 0.18s ease;
  }

  .navbar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 600;
    padding: 12px 0;
  }

  .navbar span {
    color: #007aff;
    font-size: 17px;
  }

  .app-screen {
    display: none;
    padding: 20px;
  }

  .settings-card {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
  }

  .settings-item {
    padding: 14px 4px;
    font-size: 17px;
    border-bottom: 1px solid #e5e5ea;
  }

  .settings-item:last-child {
    border-bottom: none;
  }

  iframe {
    width: 100%;
    height: 70vh;
    border: none;
    border-radius: 12px;
    margin-top: 20px;
  }

  .slider {
    width: 100%;
    margin-top: 12px;
  }
</style>
</head>

<body>

<!-- ホーム画面 -->
<div id="home">
  <div class="grid">
    <div class="icon" onclick="showApp('google')">
