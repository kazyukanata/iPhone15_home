<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone風ホーム画面</title>

<style>
  body {
    margin: 0;
    background: #ffffff; /* 背景を真っ白に */
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 40px 20px 80px;
    color: #000;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }

  .icon {
    text-align: center;
  }

  /* アイコンの余白とサイズを統一 */
  .icon img {
    width: 72px;       /* YouTubeアイコンに合わせて統一 */
    height: 72px;
    object-fit: cover; /* 余白の違いを吸収して均一化 */
    border-radius: 18px;
    background: #fff;  /* アイコン周りの白を統一 */
    padding: 4px;      /* 白い余白を均一にする */
    box-sizing: border-box;
    transition: transform 0.18s ease;
  }

  .icon img:active {
    transform: scale(1.18);
  }

  .icon p {
    margin-top: 6px;
    font-size: 12px;
  }

  .home-indicator {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 5px;
    background: #ccc;
    border-radius: 3px;
    opacity: 0.35;
  }
</style>
</head>

<body>

<div class="grid">
  <div class="icon" onclick="openApp('google.html')">
    <img src="google_icon.PNG" alt="Google">
    <p>Google</p>
  </div>

  <div class="icon" onclick="openApp('safari.html')">
    <img src="safari_icon.PNG" alt="Safari">
    <p>Safari</p>
  </div>

  <div class="icon" onclick="openApp('youtube.html')">
    <img src="youtube_icon.JPG" alt="YouTube">
    <p>YouTube</p>
  </div>

  <div class="icon" onclick="openApp('settings.html')">
    <img src="settings_icon.JPG" alt="設定">
    <p>設定</p>
  </div>
</div>

<div class="home-indicator"></div>

<script>
  function openApp(page) {
    window.location.href = page;
  }
</script>

</body>
</html>
