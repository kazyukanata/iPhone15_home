<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone風ホーム画面</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at 20% 20%, #ff8fa3, #ff6f91, #ff9671, #ffc75f, #f9f871);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  #screen {
    padding: 40px 20px 80px;
    transition: filter 0.3s ease, font-size 0.3s ease;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }

  .icon {
    text-align: center;
  }

  .icon img {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: #fff;
  }

  .navbar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 600;
    padding: 12px 0;
  }

  .navbar span {
    color: #007aff;
  }

  .app-screen {
    display: none;
    padding: 20px;
  }

  .settings-card {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
  }

  .settings-item {
    padding: 14px 4px;
    font-size: 17px;
    border-bottom: 1px solid #e5e5ea;
  }

  .settings-item:last-child {
    border-bottom: none;
  }

  iframe {
    width: 100%;
    height: 70vh;
    border: none;
    border-radius: 12px;
    margin-top: 20px;
  }

  .slider {
    width: 100%;
    margin-top: 12px;
  }
</style>
</head>

<body>
<div id="screen">

<!-- ホーム画面 -->
<div id="home">
  <div class="grid">

    <!-- Google（プライベート検索） -->
    <div class="icon" onclick="showApp('google')">
      <img src="google_icon.PNG">
      <p>Google</p>
    </div>

<!-- YouTube（nocookieでプライベート再生） -->
<div id="youtube" class="app-screen">
  <div class="navbar"><span onclick="goHome()">＜ ホーム</span>YouTube</div>
  <iframe src="https://www.youtube-nocookie.com/results?search_query=" allow="fullscreen"></iframe>
</div>

    <!-- 設定 -->
    <div class="icon" onclick="showApp('settings')">
      <img src="settings_icon.JPG">
      <p>設定</p>
    </div>

  </div>
</div>

<!-- Google（プライベート検索） -->
<div id="google" class="app-screen">
  <div class="navbar"><span onclick="goHome()">＜ ホーム</span>Google</div>

  <input id="googleInput" type="text" placeholder="検索する"
    style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;">

  <button onclick="googleSearch()" 
    style="margin-top:12px;padding:12px 20px;border-radius:10px;background:#007aff;color:white;">
    プライベート検索
  </button>

  <iframe id="googleFrame"></iframe>
</div>

<!-- YouTube（nocookieでプライベート再生） -->
<div id="youtube" class="app-screen">
  <div class="navbar"><span onclick="goHome()">＜ ホーム</span>YouTube</div>
  <iframe src="https://www.youtube-nocookie.com" allow="fullscreen"></iframe>
</div>

<!-- 設定 -->
<div id="settings" class="app-screen">
  <div class="navbar"><span onclick="goHome()">＜ ホーム</span>設定</div>

  <div class="settings-card">
    <div class="settings-item" onclick="showApp('wallpaper')">壁紙</div>
    <div class="settings-item" onclick="showApp('accessibility')">アクセシビリティ</div>
  </div>
</div>

<!-- 壁紙 -->
<div id="wallpaper" class="app-screen">
  <div class="navbar"><span onclick="showApp('settings')">＜ 設定</span>壁紙</div>

  <div class="settings-card">
    <div class="settings-item" onclick="setWallpaper('abstract')">抽象アート</div>
    <div class="settings-item" onclick="setWallpaper('gradient')">グラデーション</div>
    <div class="settings-item" onclick="setWallpaper('space')">星空・宇宙</div>
    <div class="settings-item" onclick="setWallpaper('nature')">自然・風景</div>
  </div>
</div>

<!-- アクセシビリティ -->
<div id="accessibility" class="app-screen">
  <div class="navbar"><span onclick="showApp('settings')">＜ 設定</span>アクセシビリティ</div>

  <div class="settings-card">
    <div class="settings-item">文字サイズ（老眼向け）</div>
    <input type="range" min="14" max="30" value="18" class="slider" oninput="changeFontSize(this.value)">
  </div>

  <div class="settings-card">
    <div class="settings-item">画面の明るさ</div>
    <input type="range" min="0.4" max="1" step="0.05" value="1" class="slider" oninput="changeBrightness(this.value)">
  </div>

  <div class="settings-card">
    <div class="settings-item">音声読み上げ</div>
    <button onclick="speakText()" 
      style="margin-top:12px;padding:12px 20px;border-radius:10px;background:#007aff;color:white;">
      読み上げる
    </button>
  </div>

  <div class="settings-card">
    <div class="settings-item">色覚調整（色弱モード）</div>
    <button onclick="toggleColorBlind()" 
      style="margin-top:12px;padding:12px 20px;border-radius:10px;background:#007aff;color:white;">
      ON / OFF
    </button>
  </div>
</div>

</div><!-- /screen -->

<script>
  function showApp(app) {
    document.querySelectorAll(".app-screen").forEach(s => s.style.display = "none");
    document.getElementById("home").style.display = "none";
    document.getElementById(app).style.display = "block";
  }

  function goHome() {
    document.querySelectorAll(".app-screen").forEach(s => s.style.display = "none");
    document.getElementById("home").style.display = "block";
  }

  /* Google検索（完全プライベート検索） */
  function googleSearch() {
    const q = document.getElementById("googleInput").value;
    const url =
      "https://www.google.com/search?q=" +
      encodeURIComponent(q) +
      "&hl=ja&pws=0&gl=JP&gws_rd=cr";
    document.getElementById("googleFrame").src = url;
  }

  /* 壁紙変更 */
  function setWallpaper(type) {
    if (type === "abstract") {
      document.body.style.background =
        "radial-gradient(circle at 20% 20%, #ff8fa3, #ff6f91, #ff9671, #ffc75f, #f9f871)";
    }
    if (type === "gradient") {
      document.body.style.background =
        "radial-gradient(circle at top left, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee)";
    }
    if (type === "space") {
      document.body.style.background =
        "radial-gradient(circle at center, #0f0c29, #302b63, #24243e)";
    }
    if (type === "nature") {
      document.body.style.background =
        "radial-gradient(circle at center, #a8e6cf, #dcedc1, #ffd3b6, #ffaaa5)";
    }
  }

  /* 老眼向け：文字サイズ */
  function changeFontSize(size) {
    document.getElementById("screen").style.fontSize = size + "px";
  }

  /* 明るさ調整 */
  function changeBrightness(level) {
    document.getElementById("screen").style.filter = "brightness(" + level + ")";
  }

  /* 音声読み上げ */
  function speakText() {
    const text = "画面の内容を読み上げます。設定から調整できます。";
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "ja-JP";
    window.speechSynthesis.speak(speech);
  }

  /* 色覚調整 */
  let colorBlind = false;
  function toggleColorBlind() {
    colorBlind = !colorBlind;
    document.getElementById("screen").style.filter =
      colorBlind ? "contrast(1.2) saturate(0.6)" : "none";
  }
</script>

</body>
</html>
